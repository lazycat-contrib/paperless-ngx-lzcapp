application:
  subdomain: paperless
  multi_instance: false
  # App ships its own login + user accounts, so it authenticates itself.
  public_path:
    - /
  ingress:
    - protocol: http
      port: 8000
      backend: http://webserver:8000/
  env:
    PAPERLESS_SECRET_KEY: >-
      {{ printf "%x" (stable_secret "secret_key") }}
    PAPERLESS_URL: >-
      https://{{ .S.AppDomain }}
    PAPERLESS_REDIS: redis://broker:6379
    PAPERLESS_DBHOST: db
    PAPERLESS_DBENGINE: postgresql
    PAPERLESS_DBNAME: paperless
    PAPERLESS_DBUSER: paperless
    PAPERLESS_DBPASS: >-
      {{ printf "%x" (stable_secret "db_password") }}
    PAPERLESS_ADMIN_USER: admin
    PAPERLESS_ADMIN_PASSWORD: >-
      {{ .U.admin_password }}
    PAPERLESS_ADMIN_MAIL: admin@example.com
    PAPERLESS_TIME_ZONE: Asia/Shanghai
    PAPERLESS_OCR_LANGUAGE: chi_sim+eng
    PAPERLESS_TASK_WORKERS: "2"
    PAPERLESS_THREADS_PER_WORKER: "1"
  usage: |
    Paperless-ngx 把纸质文档扫描归档：OCR 识别、全文搜索、标签与往来人管理。

    首次启动会自动创建管理员账号：
      - 用户名：admin
      - 密码：安装时填写的 admin_password

    把要归档的文件放进「consume」目录即可自动导入；也可在网页端上传。

    说明：
      - 本包只包含核心服务（webserver + PostgreSQL + Valkey）。
        官方的 Tika / Gotenberg 未启用，因此 Office 文档与邮件格式的
        解析能力有限，PDF 与图片的 OCR 正常。
      - OCR 语言设为简体中文 + 英文（chi_sim+eng）。
      - 未做实机验证。
services:
  webserver:
    image: docker.1ms.run/paperlessngx/paperless-ngx:3.4.2
    depends_on:
      - db
      - broker
    binds:
      - /lzcapp/var/data:/usr/src/paperless/data
      - /lzcapp/var/media:/usr/src/paperless/media
      - /lzcapp/var/consume:/usr/src/paperless/consume
      - /lzcapp/var/export:/usr/src/paperless/export
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  db:
    image: docker.1ms.run/library/postgres:18
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: >-
        {{ printf "%x" (stable_secret "db_password") }}
    binds:
      - /lzcapp/var/pgdata:/var/lib/postgresql
  broker:
    image: docker.1ms.run/valkey/valkey:9-alpine
    binds:
      - /lzcapp/var/redisdata:/data
